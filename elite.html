<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ذكرياتنا ↫🫀 | ♡</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
rel="stylesheet">


<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Tajawal',sans-serif;
  background:#fff;
  color:#ff4f9a;
  transition:.4s ease;
  overflow-x:hidden;
}


/* =========================
   الوضع الليلي
========================= */

body.night{
  background:#160811;
  color:#fff;
}

body.night .section{
  background:#24121d;
  border-color:#3b1a29;
}

body.night footer{
  background:#10050b;
  border-color:#3b1a29;
}

body.night .circle-btn{
  background:#2a101c;
  color:#ff8fba;
}

body.night .circle-btn:hover{
  background:#ff4f9a;
  color:#fff;
}

body.night .pages-menu{
  background:#24121d;
  border-color:#3b1a29;
}

body.night .pages-menu a{
  background:#3a1a2a;
  color:#fff;
}

body.night .card{
  background:#10050b;
  border-color:#3b1a29;
}

body.night .desc{
  background:#24121d;
  border-color:#3b1a29;
  color:#f0d9e3;
}

body.night .card-content span{
  color:#e3a0bb;
}

body.night .counter{
  color:#e3a0bb;
}

body.night footer span{
  color:#ff8fba;
}


/* =========================
   المقدمة
========================= */

.hero{
  position:relative;
  height:50vh;
  max-height:500px;
  min-height:350px;
  overflow:hidden;
  margin-bottom:20px;
  border-radius:12px;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(255,79,154,.25);
  z-index:1;
}

.hero-content{
  position:absolute;
  top:50%;
  left:50%;
  width:90%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:2;
  color:#fff;
}

.hero-content h1{
  font-size:2em;
  margin-bottom:10px;
  text-shadow:0 3px 15px rgba(0,0,0,.5);
}

.hero-content p{
  font-size:1.1em;
  line-height:1.8;
  text-shadow:0 3px 15px rgba(0,0,0,.5);
}


/* =========================
   الأزرار العلوية
========================= */

.circle-btn{
  position:fixed;
  top:20px;

  width:46px;
  height:46px;

  border-radius:50%;

  background:#ff4f9a;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  cursor:pointer;

  z-index:9999;

  transition:.3s;

  box-shadow:0 5px 20px rgba(255,79,154,.25);

  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.circle-btn:hover{
  background:#e52f7d;
  transform:scale(1.06);
}

.mode-btn{
  left:20px;
}

.home-btn{
  right:20px;
}


/* =========================
   قائمة الصفحات
========================= */

.pages-menu{

  position:fixed;

  top:75px;
  right:20px;

  background:#fff;

  padding:20px;

  border-radius:16px;

  display:none;

  flex-direction:column;

  gap:12px;

  z-index:9998;

  box-shadow:
  0 10px 30px rgba(255,79,154,.25);

  border:1px solid #ffd0e2;

  max-width:calc(100vw - 40px);
}

.pages-menu.active{
  display:flex;
}

.pages-menu a{

  color:#ff4f9a;

  text-decoration:none;

  background:#ffe6f0;

  padding:11px 18px;

  border-radius:50px;

  min-width:180px;

  text-align:center;

  transition:.3s;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.pages-menu a:hover{
  background:#ff4f9a;
  color:#fff;
}


/* =========================
   القسم
========================= */

.section{

  background:#fff0f6;

  padding:40px 20px;

  border-radius:12px;

  margin-bottom:20px;

  border:1px solid #ffd0e2;

  transition:.4s;

}


/* الفيديو الرئيسي */

.section > video{

  width:100%;

  max-height:500px;

  border-radius:12px;

  margin-bottom:20px;

  display:block;

  background:#000;
}


/* =========================
   البطاقات
========================= */

.cards{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(280px,1fr));

  gap:20px;

}

.card{

  background:#fff;

  border:1px solid #ffd0e2;

  border-radius:12px;

  overflow:hidden;

  transition:.3s;

  box-shadow:
  0 8px 25px rgba(255,79,154,.08);

}

.card:hover{
  transform:translateY(-4px);
}


/* صور / فيديوهات الذكريات */

.card video,
.card img{

  width:100%;

  height:230px;

  object-fit:cover;

  display:block;

  background:#000;

}


/* محتوى البطاقة */

.card-content{

  padding:18px;

  text-align:center;

}

.card-content h3{

  margin:5px 0;

  color:#ff4f9a;

  font-size:1.3em;

}

.card-content span{

  font-size:.9em;

  color:#c95b87;

}


/* زر عرض */

.card-content button{

  margin-top:10px;

  background:#ff4f9a;

  border:none;

  color:#fff;

  padding:9px 22px;

  border-radius:20px;

  cursor:pointer;

  font-family:'Tajawal',sans-serif;

  font-weight:bold;

  transition:.3s;

  -webkit-tap-highlight-color:transparent;

}

.card-content button:hover{

  background:#e52f7d;

  transform:scale(1.05);

}


/* =========================
   الوصف
========================= */

.desc{

  display:none;

  padding:15px;

  font-size:.95em;

  line-height:1.8;

  background:#fff0f6;

  border-top:1px solid #ffd0e2;

  color:#8f315b;

}


/* =========================
   العداد
========================= */

.counter{

  text-align
